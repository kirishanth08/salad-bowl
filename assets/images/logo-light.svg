<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="bowlGradMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#499A13" />
      <stop offset="100%" stop-color="#276F27" />
    </linearGradient>
    <linearGradient id="leafGradMaster" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ECA3C" />
      <stop offset="100%" stop-color="#CBEF16" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark: Fresh Salad Bowl -->
  <g class="brand-mark" transform="translate(4, 4)">
    <!-- Base Shadow -->
    <ellipse cx="28" cy="53" rx="20" ry="3.5" fill="#000000" opacity="0.25" />
    
    <!-- Ceramic Bowl -->
    <path d="M4 27 C4 45, 15 52, 28 52 C41 52, 52 45, 52 27 Z" fill="url(#bowlGradMaster)" />
    <!-- Bowl Rim Lip -->
    <path d="M2 27 C10 24.5, 46 24.5, 54 27 C48 30, 8 30, 2 27 Z" fill="#8ECA3C" />
    
    <!-- Fresh Sprouting Leaves inside Bowl -->
    <!-- Left Leaf -->
    <path d="M28 25 C28 12, 14 6, 8 7 C8 20, 20 25, 28 25 Z" fill="url(#leafGradMaster)" />
    <!-- Right Leaf -->
    <path d="M28 25 C31 10, 46 4, 50 3 C49 16, 37 24, 28 25 Z" fill="#8ECA3C" />
    <!-- Center Hero Leaf -->
    <path d="M28 25 C26 9, 23 2, 28 0 C33 2, 33 9, 28 25 Z" fill="#499A13" />
    <!-- Center Leaf Spine -->
    <path d="M28 25 L28 4" stroke="#CBEF16" stroke-width="1.4" stroke-linecap="round" />
    
    <!-- Vitality Sparkle Accents -->
    <circle cx="17" cy="18" r="1.4" fill="#FFFFFF" />
    <circle cx="41" cy="14" r="1.2" fill="#FFFFFF" />
    <!-- Fresh Smile Line on Bowl -->
    <path d="M12 36 C17 44, 27 46, 37 44" stroke="#CBEF16" stroke-width="2.4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wordmark BOWL'D (Solid Crisp White #FFFFFF - Constant Across All Modes) -->
  <g class="brand-wordmark" transform="translate(74, 38)" fill="#FFFFFF">
    <!-- B -->
    <path d="M0 -27 H14 C19.5 -27 23 -23.8 23 -19.5 C23 -16.2 21 -14.2 18 -13.2 C22 -12 24.5 -8.8 24.5 -4.5 C24.5 1 20 4 13.5 4 H0 V-27 Z M7 -14.5 H13 C15.8 -14.5 17.5 -16 17.5 -18.5 C17.5 -21 15.8 -22.2 13 -22.2 H7 V-14.5 Z M7 -1.2 H13.5 C16.5 -1.2 18.5 -2.8 18.5 -5.8 C18.5 -8.8 16.5 -10.2 13.5 -10.2 H7 V-1.2 Z" />
    
    <!-- O with organic inner leaf -->
    <path d="M40 -11.5 C40 -20.8 47.5 -27.5 57 -27.5 C66.5 -27.5 74 -20.8 74 -11.5 C74 -2.2 66.5 4.5 57 4.5 C47.5 4.5 40 -2.2 40 -11.5 Z M66.5 -11.5 C66.5 -17.2 62.5 -21.8 57 -21.8 C51.5 -21.8 47.5 -17.2 47.5 -11.5 C47.5 -5.8 51.5 -1.2 57 -1.2 C62.5 -1.2 66.5 -5.8 66.5 -11.5 Z" />
    <path d="M57 -18 C57 -12 60.5 -9 62 -8 C62 -14 59 -17 57 -18 Z" />
    
    <!-- W -->
    <path d="M80 -27 H87.5 L93.5 -4 L99.5 -27 H107 L113 -4 L119 -27 H126.5 L117.5 4 H109.5 L103.5 -14.5 L97.5 4 H89.5 L80 -27 Z" />
    
    <!-- L -->
    <path d="M133 -27 H140.5 V-2.2 H156.5 V4 H133 V-27 Z" />
    
    <!-- ' (Signature Floating Leaf Apostrophe) -->
    <path d="M161 -27 C164.5 -27 168 -24.5 168 -20 C168 -15.5 163.5 -11 159 -9 C161 -11 163 -14 163 -17 C163 -18.5 161.8 -19.5 160.5 -19.5 C159.2 -19.5 158.2 -18.8 158 -17.5 L157 -19 C157 -23 159 -27 161 -27 Z" />
    
    <!-- D -->
    <path d="M172 -27 H185 C195.5 -27 203 -19.8 203 -11.5 C203 -3.2 195.5 4 185 4 H172 V-27 Z M179.5 -21.5 V-1.5 H185 C191.5 -1.5 195.5 -5.8 195.5 -11.5 C195.5 -17.2 191.5 -21.5 185 -21.5 H179.5 Z" />
  </g>

  <!-- Tagline: FRESH CHOICES • FULL OF LIFE (Solid Crisp White #FFFFFF) -->
  <g class="brand-tagline" transform="translate(75, 52)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" font-size="9" letter-spacing="2.2" fill="#FFFFFF">
      FRESH CHOICES <tspan fill="#CBEF16">&#8226;</tspan> FULL OF LIFE
    </text>
  </g>
</svg>